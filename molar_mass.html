<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Molar Mass Experiment</title>
	</head>

	<body>
		<script type="module" src="src/molar_mass/MolarMassExperiment.js"></script>
		<script type="text/javascript" src="src/pageBuilder.js"></script>
        
        <!-- Should probably use addEventListener instead on inline 
         onclick handler, so that we don't need this. This is implemented like 
         this currently because the front end is being overhauled anyways. -->
        <script type="module">
            import { molarMassExperiment } from "/src/molar_mass/MolarMassExperiment.js";
            window.molarMassExperiment = molarMassExperiment;
        </script>

		<div id="body">
			<h1 id="header">Molar Mass Experiment</h1>
			<p>Press one of the following buttons to select something:</p>
			<form>
				<input type="button" id="cylinderButton" value="Select Cylinder"
				 onclick="replaceElement('body', cylinderContent, 'back')"><br>
				<input type="button" value="Select Scale" 
                    onclick="replaceElement('body', molarMassExperiment.scale.pageContent, 'back', () => setElementContent('weight-reading', 'The scale reads ' + molarMassExperiment.scale.getCurrentMass() + ' g.'))"><br>
				<input type="button" value="Select Faucet"><br>
			</form>
		</div>
	</body>
</html>
